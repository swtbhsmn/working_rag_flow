[project]
name = "local-rag-visualizer-api"
version = "0.1.0"
description = "FastAPI backend for a local llama.cpp RAG process visualizer"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "httpx>=0.28,<1",
  "numpy>=2.1,<3",
  "pymupdf>=1.25,<2",
  "python-multipart>=0.0.20,<1",
  "pydantic-settings>=2.7,<3",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]

